name: Complete issue 25 executor

on:
  push:
    branches:
      - refactor/multi-source-demand

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Retry corrected issue 25 executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run corrected refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/bootstrap-issue-25-final.yml')
          text = source.read_text()
          marker = '      - name: Re-derive and critically refine candidate\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('      - name: Validate clean candidate\n', run_start)
          raw = text[run_start:end]
          lines = raw.splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''def replace_between(value, start_marker, end_marker, replacement):
              start = value.index(start_marker)
              end = value.index(end_marker, start)
              return value[:start] + replacement + value[end:]
          '''
          new = '''def replace_between(value, start_marker, end_marker, replacement):
              start_name = start_marker.split("fn ", 1)[1].split("(", 1)[0]
              end_name = end_marker.split("fn ", 1)[1].split("(", 1)[0]
              start_token = f"fn {start_name}("
              end_token = f"fn {end_name}("
              token_start = value.index(start_token)
              start = value.rfind("\\n", 0, token_start) + 1
              token_end = value.index(end_token, token_start)
              end = value.rfind("\\n", 0, token_end) + 1
              return value[:start] + replacement + value[end:]
          '''
          if old not in body:
              raise SystemExit('refinement helper shape changed unexpectedly')
          body = body.replace(old, new, 1)
          cleanup = 'rm .github/workflows/bootstrap-issue-25-final.yml\n'
          if cleanup not in body:
              raise SystemExit('final workflow cleanup marker missing')
          body = body.replace(
              cleanup,
              cleanup + 'rm .github/workflows/bootstrap-issue-25-retry.yml\n',
              1,
          )
          subprocess.run(['bash', '-euo', 'pipefail', '-c', body], check=True)
          PY

      - name: Validate clean candidate
        shell: bash
        run: cargo validate

      - name: Publish clean candidate
        shell: bash
        run: |
          git push origin HEAD:refactor/multi-source-demand
          git push origin --delete tmp-check || true

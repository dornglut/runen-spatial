name: Bootstrap issue 25

on:
  push:
    branches:
      - refactor/multi-source-demand

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Bootstrap issue 25 executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Re-derive bounded multi-source demand
        shell: bash
        run: |
          set -euo pipefail

          # Reuse only reviewed historical lifecycle/adapter mechanics, never repository authority files.
          git show dd57fc346c5c6ec360e8ae5d597a2ac47b816f8b:crates/runen_spatial_streaming/src/controller.rs > crates/runen_spatial_streaming/src/controller.rs
          git show dd57fc346c5c6ec360e8ae5d597a2ac47b816f8b:crates/runen_spatial_streaming/src/request.rs > crates/runen_spatial_streaming/src/request.rs
          git show dd57fc346c5c6ec360e8ae5d597a2ac47b816f8b:crates/runen_spatial_streaming/src/lib.rs > crates/runen_spatial_streaming/src/lib.rs
          git show dd57fc346c5c6ec360e8ae5d597a2ac47b816f8b:crates/runen_spatial_streaming/tests/controller.rs > crates/runen_spatial_streaming/tests/controller.rs
          git show dd57fc346c5c6ec360e8ae5d597a2ac47b816f8b:adapters/godot_world_streaming/src/world_streaming_node.rs > adapters/godot_world_streaming/src/world_streaming_node.rs

          rm -f \
            crates/runen_spatial_demand/src/config.rs \
            crates/runen_spatial_demand/src/diff.rs \
            crates/runen_spatial_demand/src/policy.rs \
            crates/runen_spatial_demand/src/prelude.rs \
            crates/runen_spatial_demand/src/priority.rs \
            crates/runen_spatial_demand/src/set.rs \
            crates/runen_spatial_demand/src/streamer.rs \
            crates/runen_spatial_demand/tests/streamer.rs \
            crates/runen_spatial_streaming/src/priority.rs

          cat > crates/runen_spatial_demand/src/identity.rs <<'EOF'
          #[derive(Debug, Copy, Clone, PartialEq, Eq, PartialOrd, Ord, Hash)]
          pub struct DemandSourceId(u64);

          impl DemandSourceId {
              pub const fn new(value: u64) -> Self {
                  Self(value)
              }

              pub const fn get(self) -> u64 {
                  self.0
              }
          }

          #[derive(Debug, Copy, Clone, PartialEq, Eq, PartialOrd, Ord, Hash, Default)]
          pub struct DemandRank(u32);

          impl DemandRank {
              pub fn try_from_index(index: usize) -> Result<Self, crate::SpatialDemandError> {
                  u32::try_from(index)
                      .map(Self)
                      .map_err(|_| crate::SpatialDemandError::EffectiveRankOverflow { candidate: index })
              }

              pub const fn get(self) -> u32 {
                  self.0
              }
          }

          #[derive(Debug, Copy, Clone, PartialEq, Eq, PartialOrd, Ord)]
          pub enum DemandClass {
              Pinned,
              Desired,
              Retained,
          }

          #[derive(Debug, Copy, Clone, PartialEq, Eq)]
          pub enum DemandAxis {
              Horizontal,
              Vertical,
          }

          #[derive(Debug, Copy, Clone, PartialEq, Eq)]
          pub enum DemandLimitKind {
              Sources,
              ContributionsPerSource,
              TotalContributions,
              EffectiveChunks,
          }
          EOF

          cat > crates/runen_spatial_demand/src/focus.rs <<'EOF'
          use crate::{DemandAxis, SpatialDemandError};
          use runen_spatial::WorldPosition;

          #[derive(Debug, Copy, Clone, PartialEq)]
          pub struct DemandFocus {
              position: WorldPosition,
              horizontal_desired_radius: u32,
              horizontal_retain_radius: u32,
              vertical_desired_radius: u32,
              vertical_retain_radius: u32,
          }

          impl DemandFocus {
              pub fn try_new(
                  position: WorldPosition,
                  horizontal_desired_radius: u32,
                  horizontal_retain_radius: u32,
                  vertical_desired_radius: u32,
                  vertical_retain_radius: u32,
              ) -> Result<Self, SpatialDemandError> {
                  if horizontal_retain_radius < horizontal_desired_radius {
                      return Err(SpatialDemandError::RetainRadiusBelowDesired {
                          axis: DemandAxis::Horizontal,
                          desired: horizontal_desired_radius,
                          retain: horizontal_retain_radius,
                      });
                  }
                  if vertical_retain_radius < vertical_desired_radius {
                      return Err(SpatialDemandError::RetainRadiusBelowDesired {
                          axis: DemandAxis::Vertical,
                          desired: vertical_desired_radius,
                          retain: vertical_retain_radius,
                      });
                  }
                  Ok(Self {
                      position,
                      horizontal_desired_radius,
                      horizontal_retain_radius,
                      vertical_desired_radius,
                      vertical_retain_radius,
                  })
              }

              pub const fn position(&self) -> WorldPosition {
                  self.position
              }

              pub const fn horizontal_desired_radius(&self) -> u32 {
                  self.horizontal_desired_radius
              }

              pub const fn horizontal_retain_radius(&self) -> u32 {
                  self.horizontal_retain_radius
              }

              pub const fn vertical_desired_radius(&self) -> u32 {
                  self.vertical_desired_radius
              }

              pub const fn vertical_retain_radius(&self) -> u32 {
                  self.vertical_retain_radius
              }
          }
          EOF

          cat > crates/runen_spatial_demand/src/error.rs <<'EOF'
          use crate::{DemandAxis, DemandLimitKind, DemandSourceId};
          use runen_spatial::SpatialMathError;
          use std::fmt;

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub enum SpatialDemandError {
              SpatialMath(SpatialMathError),
              EmptySourceSnapshot,
              RetainRadiusBelowDesired {
                  axis: DemandAxis,
                  desired: u32,
                  retain: u32,
              },
              ZeroLimit {
                  limit: DemandLimitKind,
              },
              DuplicateSourceChange {
                  source_id: DemandSourceId,
              },
              SourceLimitExceeded {
                  limit: u32,
                  candidate: usize,
              },
              PerSourceContributionLimitExceeded {
                  source_id: DemandSourceId,
                  limit: u32,
                  candidate: usize,
              },
              TotalContributionLimitExceeded {
                  limit: u32,
                  candidate: usize,
              },
              PinnedCapacityExceeded {
                  limit: u32,
                  pinned: usize,
              },
              EffectiveRankOverflow {
                  candidate: usize,
              },
              CountOverflow {
                  operation: &'static str,
              },
          }

          impl From<SpatialMathError> for SpatialDemandError {
              fn from(value: SpatialMathError) -> Self {
                  Self::SpatialMath(value)
              }
          }

          impl fmt::Display for SpatialDemandError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  write!(formatter, "{self:?}")
              }
          }

          impl std::error::Error for SpatialDemandError {}
          EOF

          cat > crates/runen_spatial_demand/src/limits.rs <<'EOF'
          use crate::{DemandLimitKind, SpatialDemandError};

          #[derive(Debug, Copy, Clone, PartialEq, Eq)]
          pub struct DemandLimits {
              max_sources: u32,
              max_contributions_per_source: u32,
              max_total_contributions: u32,
              max_effective_chunks: u32,
          }

          impl DemandLimits {
              pub fn try_new(
                  max_sources: u32,
                  max_contributions_per_source: u32,
                  max_total_contributions: u32,
                  max_effective_chunks: u32,
              ) -> Result<Self, SpatialDemandError> {
                  for (value, limit) in [
                      (max_sources, DemandLimitKind::Sources),
                      (
                          max_contributions_per_source,
                          DemandLimitKind::ContributionsPerSource,
                      ),
                      (max_total_contributions, DemandLimitKind::TotalContributions),
                      (max_effective_chunks, DemandLimitKind::EffectiveChunks),
                  ] {
                      if value == 0 {
                          return Err(SpatialDemandError::ZeroLimit { limit });
                      }
                  }
                  Ok(Self {
                      max_sources,
                      max_contributions_per_source,
                      max_total_contributions,
                      max_effective_chunks,
                  })
              }

              pub const fn max_sources(&self) -> u32 {
                  self.max_sources
              }

              pub const fn max_contributions_per_source(&self) -> u32 {
                  self.max_contributions_per_source
              }

              pub const fn max_total_contributions(&self) -> u32 {
                  self.max_total_contributions
              }

              pub const fn max_effective_chunks(&self) -> u32 {
                  self.max_effective_chunks
              }
          }

          impl Default for DemandLimits {
              fn default() -> Self {
                  Self::try_new(64, 16_384, 262_144, 65_536).expect("default demand limits are valid")
              }
          }
          EOF

          cat > crates/runen_spatial_demand/src/source.rs <<'EOF'
          use crate::{DemandFocus, DemandSourceId, SpatialDemandError};
          use runen_spatial::ChunkId;
          use std::collections::BTreeSet;

          #[derive(Debug, Clone, PartialEq)]
          pub struct DemandSourceSnapshot {
              focus: Option<DemandFocus>,
              pins: BTreeSet<ChunkId>,
          }

          impl DemandSourceSnapshot {
              pub fn try_new(
                  focus: Option<DemandFocus>,
                  pins: impl IntoIterator<Item = ChunkId>,
              ) -> Result<Self, SpatialDemandError> {
                  let pins = pins.into_iter().collect::<BTreeSet<_>>();
                  if focus.is_none() && pins.is_empty() {
                      return Err(SpatialDemandError::EmptySourceSnapshot);
                  }
                  Ok(Self { focus, pins })
              }

              pub const fn focus(&self) -> Option<DemandFocus> {
                  self.focus
              }

              pub fn pins(&self) -> impl Iterator<Item = &ChunkId> {
                  self.pins.iter()
              }
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum DemandSourceChange {
              Replace {
                  source_id: DemandSourceId,
                  snapshot: DemandSourceSnapshot,
              },
              Remove {
                  source_id: DemandSourceId,
              },
          }

          impl DemandSourceChange {
              pub const fn source_id(&self) -> DemandSourceId {
                  match self {
                      Self::Replace { source_id, .. } | Self::Remove { source_id } => *source_id,
                  }
              }
          }
          EOF

          cat > crates/runen_spatial_demand/src/snapshot.rs <<'EOF'
          use crate::{DemandClass, DemandRank};
          use runen_spatial::ChunkId;

          #[derive(Debug, Copy, Clone, PartialEq, Eq)]
          pub struct DemandPressureDiagnostics {
              candidate_effective_chunks: usize,
              selected_effective_chunks: usize,
              unique_pinned_effective_chunks: usize,
              suppressed_effective_chunks: usize,
              total_source_contributions: usize,
              source_count: usize,
          }

          impl DemandPressureDiagnostics {
              pub(crate) const fn new(
                  candidate_effective_chunks: usize,
                  selected_effective_chunks: usize,
                  unique_pinned_effective_chunks: usize,
                  total_source_contributions: usize,
                  source_count: usize,
              ) -> Self {
                  Self {
                      candidate_effective_chunks,
                      selected_effective_chunks,
                      unique_pinned_effective_chunks,
                      suppressed_effective_chunks: candidate_effective_chunks - selected_effective_chunks,
                      total_source_contributions,
                      source_count,
                  }
              }

              pub const fn candidate_effective_chunks(&self) -> usize {
                  self.candidate_effective_chunks
              }

              pub const fn selected_effective_chunks(&self) -> usize {
                  self.selected_effective_chunks
              }

              pub const fn unique_pinned_effective_chunks(&self) -> usize {
                  self.unique_pinned_effective_chunks
              }

              pub const fn suppressed_effective_chunks(&self) -> usize {
                  self.suppressed_effective_chunks
              }

              pub const fn total_source_contributions(&self) -> usize {
                  self.total_source_contributions
              }

              pub const fn source_count(&self) -> usize {
                  self.source_count
              }
          }

          #[derive(Debug, Copy, Clone, PartialEq, Eq)]
          pub struct DemandedChunk {
              chunk_id: ChunkId,
              rank: DemandRank,
              class: DemandClass,
          }

          impl DemandedChunk {
              pub(crate) const fn new(chunk_id: ChunkId, rank: DemandRank, class: DemandClass) -> Self {
                  Self { chunk_id, rank, class }
              }

              pub const fn chunk_id(&self) -> ChunkId {
                  self.chunk_id
              }

              pub const fn rank(&self) -> DemandRank {
                  self.rank
              }

              pub const fn class(&self) -> DemandClass {
                  self.class
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct EffectiveDemandSnapshot {
              chunks: Vec<DemandedChunk>,
              pressure: DemandPressureDiagnostics,
          }

          impl EffectiveDemandSnapshot {
              pub(crate) fn new(chunks: Vec<DemandedChunk>, pressure: DemandPressureDiagnostics) -> Self {
                  Self { chunks, pressure }
              }

              pub fn chunks(&self) -> &[DemandedChunk] {
                  &self.chunks
              }

              pub fn len(&self) -> usize {
                  self.chunks.len()
              }

              pub fn is_empty(&self) -> bool {
                  self.chunks.is_empty()
              }

              pub fn get(&self, chunk_id: ChunkId) -> Option<&DemandedChunk> {
                  self.chunks.iter().find(|chunk| chunk.chunk_id == chunk_id)
              }

              pub const fn pressure(&self) -> DemandPressureDiagnostics {
                  self.pressure
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct SpatialDemandDelta {
              entered: Vec<DemandedChunk>,
              updated: Vec<DemandedChunk>,
              exited: Vec<DemandedChunk>,
              pressure: DemandPressureDiagnostics,
          }

          impl SpatialDemandDelta {
              pub(crate) fn new(
                  entered: Vec<DemandedChunk>,
                  updated: Vec<DemandedChunk>,
                  exited: Vec<DemandedChunk>,
                  pressure: DemandPressureDiagnostics,
              ) -> Self {
                  Self { entered, updated, exited, pressure }
              }

              pub fn entered(&self) -> &[DemandedChunk] {
                  &self.entered
              }

              pub fn updated(&self) -> &[DemandedChunk] {
                  &self.updated
              }

              pub fn exited(&self) -> &[DemandedChunk] {
                  &self.exited
              }

              pub const fn pressure(&self) -> DemandPressureDiagnostics {
                  self.pressure
              }

              pub fn is_empty(&self) -> bool {
                  self.entered.is_empty() && self.updated.is_empty() && self.exited.is_empty()
              }
          }

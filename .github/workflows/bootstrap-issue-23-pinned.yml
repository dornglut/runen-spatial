name: Bootstrap issue 23 pinned

on:
  push:
    branches:
      - refactor/godot-adapter-ownership

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Retry issue 23 executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Execute reviewed bootstrap steps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source = Path('.github/workflows/bootstrap-issue-23.yml')
          text = source.read_text()
          pattern = re.compile(
              r'      - name: (?P<name>[^\n]+)\n        shell: bash\n        run: \|\n(?P<body>(?:          .*\n|\n)+?)(?=      - name: |\Z)'
          )
          steps = list(pattern.finditer(text))
          if len(steps) != 5:
              raise SystemExit(f'expected 5 bootstrap run steps, found {len(steps)}')

          for match in steps:
              name = match.group('name')
              body = textwrap.dedent(match.group('body'))
              if name == 'Commit candidate and remove bootstrap workflow':
                  Path('.github/workflows/bootstrap-issue-23-pinned.yml').unlink()
              print(f'Executing: {name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', body], check=True)
          PY

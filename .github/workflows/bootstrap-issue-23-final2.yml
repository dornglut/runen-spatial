name: Bootstrap issue 23 final 2

on:
  push:
    branches:
      - refactor/godot-adapter-ownership

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Fix issue 23 lock assertion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply, validate, and push candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/bootstrap-issue-23.yml')
          text = source.read_text()

          def step_body(name):
              marker = f'      - name: {name}\n'
              start = text.index(marker)
              run_start = text.index('        run: |\n', start) + len('        run: |\n')
              next_step = text.find('      - name: ', run_start)
              end = len(text) if next_step == -1 else next_step
              raw = text[run_start:end]
              lines = raw.splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          print('Executing: Apply authorized topology cutover', flush=True)
          subprocess.run(
              ['bash', '-euo', 'pipefail', '-c', step_body('Apply authorized topology cutover')],
              check=True,
          )

          lock = Path('Cargo.lock')
          content = lock.read_text()
          stanza = '''[[package]]\nname = "chunk_streaming_demo"\nversion = "0.1.0"\ndependencies = [\n "runen-spatial",\n "runen-spatial-demand",\n "runen-spatial-streaming",\n]\n\n'''
          if content.count(stanza) != 1:
              raise SystemExit('expected exactly one chunk_streaming_demo lock stanza')
          lock.write_text(content.replace(stanza, '', 1))
          subprocess.run(
              ['cargo', 'metadata', '--format-version', '1', '--locked', '--no-deps'],
              stdout=subprocess.DEVNULL,
              check=True,
          )
          diff = subprocess.check_output(['git', 'diff', '--', 'Cargo.lock'], text=True)
          added = [line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          expected = ['-' + line for line in stanza.splitlines()]
          if added or removed != expected:
              raise SystemExit(f'unexpected Cargo.lock churn:\n{diff}')

          for path in [
              '.github/workflows/bootstrap-issue-23-pinned.yml',
              '.github/workflows/bootstrap-issue-23-pinned2.yml',
              '.github/workflows/bootstrap-issue-23-final.yml',
              '.github/workflows/bootstrap-issue-23-final2.yml',
          ]:
              Path(path).unlink()

          for name in [
              'Commit candidate and remove bootstrap workflow',
              'Validate clean candidate',
              'Push candidate',
          ]:
              print(f'Executing: {name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', step_body(name)], check=True)
          PY

[workspace]
resolver = "3"
members = [
  "crates/spatial",
  "crates/spatial_index",
  "crates/chunking",
  "crates/world_streaming",
  "crates/world_core_prelude",
  "adapters/godot_world_streaming",
  "demos/chunk_streaming_demo",
]

default-members = [
  "crates/spatial",
  "crates/spatial_index",
  "crates/chunking",
  "crates/world_streaming",
  "crates/world_core_prelude",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chunking = { path = "crates/chunking" }
godot = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
spatial = { path = "crates/spatial" }
spatial_index = { path = "crates/spatial_index" }
world_streaming = { path = "crates/world_streaming" }
